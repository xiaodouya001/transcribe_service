<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转录本地 Demo - Payload 注入</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 800px; }
    h1 { font-size: 1.25rem; }
    textarea { width: 100%; height: 260px; font-family: monospace; font-size: 13px; padding: 0.5rem; }
    .actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    button.primary { background: #2563eb; color: white; border: none; border-radius: 4px; }
    button.secondary { background: #e5e7eb; border: none; border-radius: 4px; }
    .msg { margin-top: 0.5rem; padding: 0.5rem; border-radius: 4px; }
    .msg.success { background: #dcfce7; color: #166534; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .msg.hidden { display: none; }
    .monitor { font-size: 0.875rem; padding: 0.5rem; background: #f3f4f6; border-radius: 4px; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>转录本地 Demo - Payload 注入</h1>
  <div id="monitor" class="monitor">携程数：- &nbsp; 活跃会话数：-</div>
  <p>输入 JSON payload，点击「发送」后推送到对应 session 的 SSE 流。多会话时 <code>result.callStatus.sessionId</code> 需与已注册的 session 一致（demo-session-1/2/3）。</p>
  <div class="actions" style="margin-bottom: 0.5rem;">
    <label>Session: </label>
    <select id="sessionId">
      <option value="demo-session-1">demo-session-1</option>
      <option value="demo-session-2">demo-session-2</option>
      <option value="demo-session-3">demo-session-3</option>
    </select>
  </div>
  <textarea id="payload" placeholder='{"success": true, "result": {...}}'></textarea>
  <div class="actions">
    <button class="primary" id="send">发送到 SSE</button>
    <button class="secondary" id="sampleNormal">填充正常示例</button>
    <button class="secondary" id="sampleEof">填充 EOF 示例</button>
    <button class="secondary" id="concurrent">并发测试（3 session 同时注入）</button>
  </div>
  <div id="msg" class="msg hidden"></div>

  <script>
    (function pollMetrics() {
      fetch('/metrics')
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          const el = document.getElementById('monitor');
          if (!data) {
            el.textContent = '携程数：- &nbsp; 活跃会话数：-';
            return;
          }
          const coroutines = data.coroutines ?? '-';
          const sessions = data.connector_sessions != null ? data.connector_sessions : (data.sessions ?? '-');
          el.innerHTML = '携程数：' + coroutines + ' &nbsp; 活跃会话数：' + sessions;
        })
        .catch(() => {
          document.getElementById('monitor').textContent = '携程数：- &nbsp; 活跃会话数：-';
        });
      setTimeout(pollMetrics, 1500);
    })();

    const SAMPLE = {
      "success": true,
      "result": {
        "processingId": "f1941193-0775-4db57-96a2-98517dbe01f6",
        "processingStatus": "IN_PROGRESS",
        "createdAt": "2025-03-21T10:30:02.327Z",
        "callStatus": {
          "agentId": "3210001",
          "staffId": "45163407",
          "customerId": "12345678",
          "sessionId": "demo-session-1",
          "startTime": "2025-03-21T10:30:02.327Z",
          "endTime": null
        },
        "transcripts": [
          { "seqNo": 0, "transcript": "您好，请问有什么可以帮您？", "role": "Agent", "createdAt": "2025-03-21T10:32:20.000Z" },
          { "seqNo": 1, "transcript": "你好，我想咨询一下贷款业务。", "role": "Customer", "createdAt": "2025-03-21T10:32:25.000Z" }
        ]
      }
    };

    function getSample() {
      const sid = document.getElementById('sessionId').value;
      const s = JSON.parse(JSON.stringify(SAMPLE));
      s.result.callStatus.sessionId = sid;
      return s;
    }
    function getEofSample() {
      const sid = document.getElementById('sessionId').value;
      return { event: 'request', data: 'EOF', session_id: sid };
    }
    document.getElementById('sampleNormal').onclick = () => {
      document.getElementById('payload').value = JSON.stringify(getSample(), null, 2);
    };
    document.getElementById('sampleEof').onclick = () => {
      document.getElementById('payload').value = JSON.stringify(getEofSample(), null, 2);
    };

    function showMsg(text, isError) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'error' : 'success');
      el.classList.remove('hidden');
    }

    document.getElementById('send').onclick = async () => {
      const raw = document.getElementById('payload').value.trim();
      if (!raw) {
        showMsg('请输入 JSON payload', true);
        return;
      }
      let payload;
      try {
        payload = JSON.parse(raw);
        const sid = document.getElementById('sessionId').value;
        if (payload.event === 'request' && payload.data === 'EOF') {
          payload.session_id = sid;
        } else {
          payload.result = payload.result || {};
          payload.result.callStatus = payload.result.callStatus || {};
          payload.result.callStatus.sessionId = sid;
        }
      } catch (e) {
        showMsg('JSON 格式错误: ' + e.message, true);
        return;
      }
      try {
        const r = await fetch('/inject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!r.ok) {
          const t = await r.text();
          showMsg('发送失败: ' + (t || r.status), true);
          return;
        }
        showMsg('已发送，请查看控制台日志。', false);
      } catch (e) {
        showMsg('请求失败: ' + e.message, true);
      }
    };

    document.getElementById('concurrent').onclick = async () => {
      const raw = document.getElementById('payload').value.trim();
      if (!raw) {
        showMsg('请先在文本框填写 JSON payload', true);
        return;
      }
      const sessions = ['demo-session-1', 'demo-session-2', 'demo-session-3'];
      let payloads;
      try {
        const base = JSON.parse(raw);
        payloads = sessions.map((sid, i) => {
          const p = JSON.parse(JSON.stringify(base));
          if (p.event === 'request' && p.data === 'EOF') {
            p.session_id = sid;
          } else {
            p.result = p.result || {};
            p.result.callStatus = p.result.callStatus || {};
            p.result.callStatus.sessionId = sid;
            if (p.result.processingId) p.result.processingId = p.result.processingId + '-' + i;
            if (Array.isArray(p.result.transcripts)) {
              p.result.transcripts.forEach((t, j) => { t.seqNo = i * 10 + j; });
            }
          }
          return { sid, payload: p };
        });
      } catch (e) {
        showMsg('JSON 格式错误: ' + e.message, true);
        return;
      }
      try {
        const results = await Promise.all(
          payloads.map(({ sid, payload }) =>
            fetch('/inject', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).then(r => ({ sid, ok: r.ok }))
          )
        );
        const ok = results.filter(r => r.ok).length;
        showMsg(`并发注入完成: ${ok}/3 成功`, ok === 3);
      } catch (e) {
        showMsg('并发请求失败: ' + e.message, true);
      }
    };
  </script>
</body>
</html>
