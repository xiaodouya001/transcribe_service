[aws]
profile = "saml"
region = "ap-east-1"

[app]
# =============================================================================
# 重要提示
# 在 base.toml 中使用 "__UNSET__" 表示仅保留配置位，不写入最终 secret；请在 <env>.toml 或 <env>.secrets.toml 中覆盖
# =============================================================================

# =============================================================================
# Redis（状态机）
# =============================================================================
# Redis 连接地址（建议不含 user:password@；凭据用下面 REDIS_USERNAME / REDIS_PASSWORD）
# 本地: redis://host:port/db ；ECS+ElastiCache TLS: rediss://primary-endpoint:PORT/db（端口以集群为准）
REDIS_URL = "__UNSET__"
# ACL 用户名（可选；无 ACL 可留空）。生产建议 ECS Secrets 注入，勿写入镜像或明文配置库
# "__UNSET__" 表示默认不下发，按环境需要再覆盖
REDIS_USERNAME = "__UNSET__"
# 密码（可选）。生产用 AWS Secrets Manager → ECS task secret 映射为环境变量，勿写进 REDIS_URL
# "__UNSET__" 表示默认不下发，按环境需要再覆盖
REDIS_PASSWORD = "__UNSET__"
# TLS 是否校验证书主机名（redis-py ssl_check_hostname）。经 NLB 等别名连 ElastiCache 而证书 SAN 不匹配时保持 false；
# 直连 Primary endpoint 且证书匹配时可设为 true
REDIS_SSL_CHECK_HOSTNAME = false
# Redis 连接池大小（高并发时调大）
# 每条 WS 消息需 2 次 Redis 往返（prepare + commit），await 期间持有连接。
# 500 并发低延迟档建议：1600（覆盖连接占用与抖动）
# 1000 并发容量档可提升到 2000+
# 勿超过 Redis maxclients（默认 10000）
REDIS_MAX_CONNECTIONS = 1600
# 活跃会话 TTL（秒），每次写入自动续期
REDIS_ACTIVE_TTL_SEC = 3600
# SESSION_COMPLETE 后的残留 TTL（秒），兜住迟到包
REDIS_FINAL_TTL_SEC = 30
# conversation 发送连接 owner key TTL（秒）
REDIS_OWNERSHIP_GUARD_TTL_SEC = 30
# Redis Sequence State Machine key 前缀
# 默认无云环境命名空间。上线到 ElastiCache 等时按用户 ACL 加前缀（如 your-ns:realtime-transcribe-service:…，ACL 如 ~your-ns:*）
# "__UNSET__" 表示默认不下发，必须在 <env>.toml 中提供环境前缀
REDIS_SEQUENCE_STATE_KEY_PREFIX = "__UNSET__"
# Redis Ownership Guard key 前缀（须与 sequence 前缀的命名空间策略一致）
# "__UNSET__" 表示默认不下发，必须在 <env>.toml 中提供环境前缀
REDIS_OWNERSHIP_GUARD_KEY_PREFIX = "__UNSET__"

# =============================================================================
# Kafka
# =============================================================================
# Kafka 集群地址
# "__UNSET__" 表示默认不下发，必须在 <env>.secrets.toml 中提供真实值
KAFKA_BOOTSTRAP_SERVERS = "__UNSET__"
# Kafka 模式：local=本地明文、不建 topic；aws_msk=MSK IAM、不建 topic，topic 须预先存在
KAFKA_MODE = "aws_msk"
# Topic 名称
KAFKA_TOPIC = "AI_STAGING_TRANSCRIPTION"
# 压缩类型：none、gzip、snappy、lz4、zstd
KAFKA_COMPRESSION_TYPE = "zstd"
# 自定义 Kafka TLS CA 证书链文件路径；仅在 aws_msk 且 broker/NLB 证书不被系统默认信任时启用
# "__UNSET__" 表示默认不下发，按环境需要再覆盖
KAFKA_SSL_CA_FILE = "__UNSET__"
# 仅在 Kafka 与 Secrets Manager 不同区域，或你要显式覆盖时再设置；
# 默认回退到 ECS bootstrap 的 AWS_REGION / AWS_DEFAULT_REGION
KAFKA_AWS_REGION = "__UNSET__"
# 仅 aws_msk 且排障时临时 true；生产长期 false 或省略
KAFKA_AWS_DEBUG_CREDS = false
# 发送超时（秒），Kafka 不可用时快速失败
# 高并发下单机 broker 偶尔慢，5s 比 2s 宽容又不至于拖死连接
KAFKA_SEND_TIMEOUT_SEC = 5
# producer 聚合等待（ms）：越小延迟越低、吞吐可能略降
KAFKA_LINGER_MS = 1
# producer 批大小（bytes）：中等批次兼顾吞吐与尾延迟
KAFKA_BATCH_SIZE = 32768

# =============================================================================
# WebSocket
# =============================================================================
# Uvicorn websockets 后端：服务端主动发 Ping 的间隔 / 等 Pong 超时（秒）
WS_PING_INTERVAL = 20.0
WS_PING_TIMEOUT = 10.0
# 会话发送所有权后台续租周期（秒）
WS_OWNERSHIP_GUARD_REFRESH_INTERVAL_SEC = 15.0

# =============================================================================
# Handshake Authentication
# =============================================================================
# Whether to enforce Authorization: Bearer <JWT> during WebSocket handshake
AUTH_ENABLED = true
# HS256 signing material; required when AUTH_ENABLED=true
# "__UNSET__" 表示默认不下发，只有 AUTH_ENABLED=true 时才必须覆盖
AUTH_JWT_SIGNING_MATERIAL = "__UNSET__"
# Current implementation only supports HS256
AUTH_JWT_ALGORITHM = "HS256"

# =============================================================================
# HTTP / Uvicorn
# =============================================================================
# 监听端口（监听地址固定为 0.0.0.0，见代码 constants.DEFAULT_HTTP_HOST）
HTTP_PORT = 8080
# listen backlog，瞬时大量 WS 握手时可酌情调大
HTTP_BACKLOG = 4096
# 只有当值为 true 时才暴露 /docs、/redoc、/openapi.json；其余值一律关闭（默认 false 时 /docs 与 /{prefix}/docs 均为 404）
HTTP_ENABLE_DOCS = true
# 可选：ALB/ingress 路径前缀；非空时路由为 /{prefix}/health、/{prefix}/ws/v1/... 等。要看 /abc/docs 须同时设 URL_PATH_PREFIX=abc（或 /abc）且 HTTP_ENABLE_DOCS=true
URL_PATH_PREFIX = "/transcribe-svc"
# 最大同时在线 WS 连接数；超限时握手前返回 HTTP 429 + E1008。0=不限
# 500 并发低延迟档建议：600（约目标并发 1.2x，留连接交叠空间）
# 1000 并发容量档可提升到 1200+
WS_MAX_CONNECTIONS = 600

# =============================================================================
# 启动检查
# =============================================================================
# Kafka 启动连通性检查超时（秒）
KAFKA_STARTUP_TIMEOUT_SEC = 30.0

# =============================================================================
# 其它
# =============================================================================
# 优雅停机超时（秒）
STOP_TIMEOUT = 120.0
# 日志级别：DEBUG、INFO、WARNING、ERROR
# 压测时建议 WARNING 减少 I/O 开销；排查问题时切回 INFO
LOG_LEVEL = "INFO"
# 日志格式：json、console、auto（非 TTY 自动用 json）
LOG_FORMAT = "json"
# 是否抑制 /health 和 /ready 的 uvicorn access 日志（ECS/ALB 健康检查建议开启）
SUPPRESS_HEALTH_ACCESS_LOGS=true
# 是否打印服务端发出的 ERROR 响应完整 JSON（排障用；压测时建议关闭）
LOG_WS_ERROR_FRAMES = true
# 慢消息分段耗时 WARNING 阈值（毫秒）；0=关闭
# 开启后会在单条消息总耗时超过阈值时限频输出 decode/validate/prepare/kafka_send/commit/ack/send 分段
LOG_SLOW_MESSAGE_THRESHOLD_MS = 200.0
