# pyproject.toml 配置说明
# 各配置块用途及 Local/Dev/Production 使用方式见 docs/pyproject-config.md

[project]
name = "transcribe-service"
version = "0.1.0"
description = "Transcribe Service - realtime transcription WebSocket gateway"
requires-python = ">=3.11"
dependencies = [
    "aiokafka[lz4]>=0.10.0",
    "orjson>=3.9.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "fakeredis[lua]>=2.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src/transcribe_service --cov=config --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src", "config"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["config*", "transcribe_service*"]

# Poetry 包管理（可选，与 pip/venv 二选一）
[tool.poetry]
name = "transcribe-service"
version = "0.1.0"
description = "Transcribe Service - realtime transcription WebSocket gateway"
packages = [
    {include = "config"},
    {include = "transcribe_service", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.11"
aiokafka = {extras = ["lz4"], version = ">=0.10.0"}
orjson = ">=3.9.0"
redis = ">=5.0.0"
pydantic-settings = ">=2.0"
structlog = ">=24.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.22.0"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
fakeredis = {extras = ["lua"], version = ">=2.20.0"}
httpx = ">=0.27.0"
pytest-cov = ">=7.0.0,<8.0.0"
