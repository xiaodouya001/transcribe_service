[project]
name = "asr-ingest"
version = "0.1.0"
description = "AWS real-time ASR transcription ingestion service"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "fakeredis>=2.20.0",
    "streamlit>=1.28.0",
    "streamlit-mermaid>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["config*", "asr_ingest*"]

# Poetry 包管理（可选，与 pip/venv 二选一）
[tool.poetry]
name = "asr-ingest"
version = "0.1.0"
description = "AWS real-time ASR transcription ingestion service"
packages = [
    {include = "config"},
    {include = "asr_ingest", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.11"
aiokafka = ">=0.10.0"
redis = ">=5.0.0"
httpx = ">=0.27.0"
websockets = ">=12.0"
pydantic-settings = ">=2.0"
structlog = ">=24.0"
aiohttp = ">=3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
fakeredis = ">=2.20.0"
streamlit = ">=1.28.0"
streamlit-mermaid = ">=0.3.0"
