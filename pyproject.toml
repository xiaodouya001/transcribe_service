# `pyproject.toml` reference
# See docs/pyproject-config.md for block-by-block details and Local/Dev/Production usage

[project]
name = "realtime-transcribe-service"
version = "1.0.0"
description = "Realtime Transcribe Service - realtime transcription WebSocket gateway"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "aiokafka[lz4]>=0.10.0",
    "aws-msk-iam-sasl-signer-python>=1.0.0",
    "orjson>=3.9.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "fakeredis[lua]>=2.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "ci-cd/tests"]
addopts = "--cov=src/realtime_transcribe_service --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["src"]
include = ["realtime_transcribe_service*"]

# Optional Poetry workflow; use either Poetry or pip/venv
[tool.poetry]
name = "realtime-transcribe-service"
version = "1.0.0"
description = "Realtime Transcribe Service - realtime transcription WebSocket gateway"
packages = [
    {include = "realtime_transcribe_service", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.11"
boto3 = ">=1.34.0"
aiokafka = {extras = ["lz4"], version = ">=0.10.0"}
aws-msk-iam-sasl-signer-python = ">=1.0.0"
orjson = ">=3.9.0"
PyJWT = ">=2.8.0"
redis = ">=5.0.0"
pydantic-settings = ">=2.0"
structlog = ">=24.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.22.0"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
fakeredis = {extras = ["lua"], version = ">=2.20.0"}
httpx = ">=0.27.0"
pytest-cov = ">=7.0.0,<8.0.0"

